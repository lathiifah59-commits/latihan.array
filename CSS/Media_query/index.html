<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Quemerry</title>
</head>
<body>
    <head>
    <style>

    .box{
        width: 100%;
        padding: 20px;
        background-color: steelblue;
        text-align:center;
    }

    @media (max-width: 768px){
        .box{
            background-color: darkorange;
        }
    }

    @media (max-width: 480px){
        .box{
            font-size: 14px;
        }
    }
    </style>
    </head>

    <body>
        <div class="box">contoh box responsif</div>
    </body>
</body>
</html>
